name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Root install — this is an npm-workspaces monorepo, `npm ci` must
      # run at the repo root, not inside apps/api.
      - name: Install dependencies
        run: npm ci
      # No real Postgres/Redis needed: auth.service.spec.ts,
      # interviews.service.spec.ts, and resumes.service.spec.ts all mock
      # PrismaService/RedisService/AiClientService directly rather than
      # hitting real infra. Prisma client generation is still needed since
      # the compiled TS imports its types.
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
      - name: Lint
        working-directory: apps/api
        run: npm run lint
      - name: Type check
        working-directory: apps/api
        run: npx tsc --noEmit
      - name: Test
        working-directory: apps/api
        run: npm test

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit
      # Placeholder values — this only needs to satisfy env.ts's/env.public.ts's
      # zod schemas at build time (module-level `.parse(...)` calls run on
      # import regardless of whether a page actually uses them); nothing
      # here makes a real network call during the build.
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXTAUTH_SECRET: ci-placeholder-secret
        run: npm run build

  ai-service:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: pytest
